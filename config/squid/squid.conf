# Egress allowlist proxy for sandboxed agents.
# Default deny; CONNECT only to allowlisted hosts on allowed ports; one log line per request.
# See docs/02-network.md.

http_port 3128

acl agents      src 172.30.0.0/24
acl CONNECT     method CONNECT
acl p443        port 443
acl allow_443   dstdomain -n "/etc/squid/allowlist-443.txt"
# One pair per additional port, e.g.:
# acl p8443 port 8443
# acl allow_8443 dstdomain -n "/etc/squid/allowlist-8443.txt"

http_access deny to_localhost
http_access deny to_linklocal                 # 169.254.0.0/16, i.e. cloud metadata
http_access allow agents CONNECT allow_443 p443
# http_access allow agents CONNECT allow_8443 p8443
http_access deny all                          # default deny, incl. plain HTTP

cache deny all
via off
forwarded_for delete

logformat agentlog %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %Sh/%<a
access_log stdio:/var/log/squid/access.log agentlog
